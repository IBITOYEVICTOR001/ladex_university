<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Create student account | Ladex International University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main-content">
    <section class="page-banner"><div class="wrap"><p><a href="../index.html">Home</a> <span>/</span> Student account</p><h1>Create your account</h1></div></section>
    <section class="section wrap student-auth">
      <div class="student-auth-card">
      <img class="student-auth-logo" src="../images/logo1.png" width="52" height="52" alt="Ladex International University logo">
      <div class="section-heading"><div><p class="eyebrow gold-text">Student portal</p><h2>Start your application.</h2></div></div>
      <form id="student-register-form" class="contact-form">
        <label>Full name<input name="fullName" autocomplete="name" required></label>
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="button button-gold" type="submit">Create account</button>
        <p class="form-response" aria-live="polite"></p>
      </form>
      <p id="apply-access-note" class="notice" hidden>Create an account or log in to apply.</p>
      <p>Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/main.js"></script>
  <script type="module" src="../js/student.js"></script>
</body>
</html>
