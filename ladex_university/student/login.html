<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Login | Ladex International University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main-content">
    <section class="page-banner"><div class="wrap"><p><a href="../index.html">Home</a> <span>/</span> Student Login</p><h1>Student Login</h1></div></section>
    <section class="section wrap">
      <div class="section-heading"><div><p class="eyebrow gold-text">Student portal</p><h2>Welcome back.</h2></div></div>
      <form id="student-login-form" class="contact-form">
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button button-gold" type="submit">Log in</button>
        <p class="form-response" aria-live="polite"></p>
      </form>
      <p><a id="forgot-password" href="#">Forgot password?</a></p>
      <p>New student? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="../js/main.js"></script>
  <script type="module" src="../js/student.js"></script>
</body>
</html>
